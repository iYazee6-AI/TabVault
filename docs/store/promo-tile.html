<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TabVault promo tile</title>
    <style>
      /* Rendered by tools/screenshots.js at exactly 440x280.
         Colours are TabVault's own accent tokens from app/index.html. */
      html, body { margin: 0; padding: 0; }
      body {
        width: 440px;
        height: 280px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(160deg, #0b3f3a 0%, #072e2a 55%, #041d1b 100%);
        color: #ffffff;
        font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
        text-align: center;
      }
      img { width: 128px; height: 128px; display: block; border-radius: 26px; box-shadow: 0 8px 26px rgba(0, 0, 0, 0.35); }
      .name { font-size: 40px; font-weight: 700; letter-spacing: 0.5px; line-height: 1; }
      .tagline { font-size: 16px; font-weight: 400; color: #d7f0ec; line-height: 1.3; max-width: 360px; }
    </style>
  </head>
  <body>
    <img src="../../icons/icon128.png" alt="" />
    <div class="name">TabVault</div>
    <div class="tagline">Every window and tab in one page</div>
  </body>
</html>
