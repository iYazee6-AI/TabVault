name: Release build

# Manual only: Actions → "Release build" → Run workflow.
# Version = manifest major.minor.patch + this run's number (e.g. 1.0.0.7), a
# four-segment version Chrome and the Web Store accept. The stamp happens in
# the runner only; nothing is committed back. Output: a workflow artifact and
# a GitHub Release "v<version>" with the store zip attached.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (leave empty to auto-generate from commits)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Secret scan, before the build gets anywhere near a release asset.
      # gitleaks/gitleaks-action@v2 is the usual choice, but it is only free
      # for public repositories - on a private repo it wants a GITLEAKS_LICENSE
      # secret. The official image has no such restriction, so it is used here
      # and this step keeps working if the repo ever goes private.
      - name: Gitleaks (secret scan)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --no-banner --redact

      # Dependency CVEs across the lockfile, plus vendored files that
      # `npm audit` never sees. HIGH/CRITICAL only, and only where a fix has
      # actually shipped, so the gate stays actionable.
      - name: Trivy (filesystem vulnerability scan)
        # Pinned image rather than trivy-action: the action's internal
        # setup-trivy tag was deleted upstream and broke every run.
        run: docker run --rm -v "$PWD:/repo" aquasec/trivy:0.74.0 fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /repo

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # eslint + eslint-plugin-security. --ignore-scripts keeps Playwright
      # from downloading browsers the release build never uses.
      - name: Install dev dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        # `npm run lint` is clean in this repo, so a new finding is a
        # hard failure.
        run: npm run lint

      - name: Unit tests
        run: |
          if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.test ? 0 : 1)"; then
            npm test
          else
            echo "no test script; skipping"
          fi

      - name: Stamp build version
        id: stamp
        run: |
          base=$(node -p "require('./manifest.json').version.split('.').slice(0,3).join('.')")
          version="$base.${{ github.run_number }}"
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            for (const f of ["manifest.json", "package.json"]) {
              if (!fs.existsSync(f)) continue;
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            console.log("stamped", v);
          ' "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: npm run pack

      - name: Show the zip
        run: |
          ls -la dist
          if [ -f tools/list-zip.js ]; then node tools/list-zip.js dist/*.zip; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ steps.stamp.outputs.version }}
          path: dist/*.zip
          retention-days: 90
          if-no-files-found: error

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.stamp.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          tag="v$VERSION"
          title="${{ github.event.repository.name }} $VERSION"
          if [ -n "$NOTES" ]; then
            gh release create "$tag" dist/*.zip --target "$GITHUB_SHA" --title "$title" --notes "$NOTES"
          else
            gh release create "$tag" dist/*.zip --target "$GITHUB_SHA" --title "$title" --generate-notes
          fi
          echo "Released $tag: https://github.com/${{ github.repository }}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
