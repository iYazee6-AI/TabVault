name: CI

# Runs on every push and pull request: the same lint, unit-test and pack gates
# the release build runs, without the release. The e2e harness needs a headed
# browser with the extension loaded and stays a local gate (npm run e2e).

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dev dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Pack
        run: npm run pack
